<!doctype html><html><head><meta charset="utf-8"><title>Career record source layout preview</title><link rel="stylesheet" href="CareerLanding.css"><style>
 @font-face { font-family:'Chakra Petch'; src:url('/Assets/fonts/ChakraPetch-Regular.ttf'); font-weight:400; }
 @font-face { font-family:'Chakra Petch'; src:url('/Assets/fonts/ChakraPetch-Medium.ttf'); font-weight:500; }
 @font-face { font-family:'Chakra Petch'; src:url('/Assets/fonts/ChakraPetch-SemiBold.ttf'); font-weight:600; }
 @font-face { font-family:'Chakra Petch'; src:url('/Assets/fonts/ChakraPetch-Bold.ttf'); font-weight:700; }
 * { box-sizing:border-box; } html,body,.main-menu-root { margin:0; width:100%; height:100%; } body { background:#08090b; }
 div,careerlanding,careerweapon,careerstat,button { display:flex; } label { display:block; } button { font:inherit; text-align:left; }
 .weapon-search-entry { display:flex; border:0; background:none; outline:none; width:100%; }
 .weapon-search i,.weapon-record-empty i,.weapon-clear i { font-family:Arial; font-style:normal; }
 .preview-note { position:fixed; bottom:6px; right:16px; color:#aaa; font:11px Arial; }
 </style></head><body><div class="main-menu-root"><careerlanding class="hc1 progression-page"><div class="progression-body">
 <div class="player-stats"><label class="section-title">FIELD STATISTICS</label><careerstat><label class="name">Kills</label><label class="value">0</label></careerstat><careerstat><label class="name">Headshot Kills</label><label class="value">0</label></careerstat><careerstat><label class="name">Deaths</label><label class="value">0</label></careerstat></div>
 <div class="progression-content"><div class="weapon-record"><div class="weapon-record-heading"><label class="section-title">WEAPON RECORD</label><label class="weapon-record-count">0 / 32 WEAPONS</label></div><div class="weapon-categories"><button class="weapon-category active"><label>ALL WEAPONS</label><label class="category-count">32</label></button><button class="weapon-category "><label>ASSAULT</label><label class="category-count">17</label></button><button class="weapon-category "><label>SMG</label><label class="category-count">6</label></button><button class="weapon-category "><label>LMG</label><label class="category-count">2</label></button><button class="weapon-category "><label>SNIPER</label><label class="category-count">1</label></button><button class="weapon-category "><label>SHOTGUN</label><label class="category-count">2</label></button><button class="weapon-category "><label>PISTOL</label><label class="category-count">4</label></button></div>
 <div class="weapon-record-tools"><div class="weapon-search"><i>⌕</i><input class="weapon-search-entry" placeholder="Search weapons" value="zzzzz"></div><div class="weapon-sort"><label class="weapon-sort-label">SORT BY</label><button class="weapon-sort-option active"><label>Name</label></button><button class="weapon-sort-option "><label>Kills</label></button><button class="weapon-sort-option "><label>Level</label></button></div><button class="weapon-clear"><i>×</i><label>CLEAR FILTERS</label></button></div>
 <div class="weapon-record-empty"><i>⌕</i><label class="weapon-empty-title">No weapons match your filters.</label><label>Try another name or category.</label></div>
 </div></div></div></careerlanding></div><label class="preview-note">SOURCE LAYOUT PREVIEW · SAMPLE STATISTICS</label><script>
 function resize(){ const root=document.querySelector('.main-menu-root'); root.classList.toggle('compact',innerWidth<1600); root.classList.toggle('narrow',innerWidth<1200); root.classList.toggle('portrait',innerWidth<800); } resize();addEventListener('resize',resize);
 </script></body></html>
