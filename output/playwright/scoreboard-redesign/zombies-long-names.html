Scoreboard {
    position: absolute;
    inset: 0;
    z-index: 2000;
    align-items: center;
    justify-content: center;
    padding-top: 36px;
    background-color: rgba(3, 6, 10, 0.72);
    backdrop-filter: blur(5px);
    pointer-events: none;
    font-family: Chakra Petch;
    color: #eef1f3;
}

Scoreboard.visible {
    pointer-events: all;
    cursor: default;
}

Scoreboard label,
Scoreboard button {
    font-family: Chakra Petch;
    text-shadow: none;
}

Scoreboard .scoreboard-panel {
    width: 1520px;
    max-width: 94%;
    max-height: 82%;
    flex-direction: column;
    background-color: rgba(15, 20, 27, 0.97);
    border: 1px solid rgba(197, 211, 224, 0.16);
    border-radius: 3px;
    box-shadow: 0 18px 70px rgba(0, 0, 0, 0.5);
}

Scoreboard .match-heading {
    min-height: 104px;
    padding: 22px 28px;
    align-items: center;
    gap: 24px;
    flex-shrink: 0;
    border-bottom: 1px solid rgba(197, 211, 224, 0.12);
}

Scoreboard .match-identity {
    flex-direction: column;
    flex-grow: 1;
    min-width: 0;
    gap: 3px;
}

Scoreboard .eyebrow {
    font-size: 11px;
    letter-spacing: 2.5px;
    color: #98a5b5;
    font-weight: 600;
}

Scoreboard .match-title {
    font-size: 30px;
    font-weight: 700;
    white-space: nowrap;
    text-overflow: ellipsis;
    overflow: hidden;
}

Scoreboard .match-state {
    flex-direction: column;
    align-items: flex-end;
    gap: 5px;
    max-width: 34%;
    flex-shrink: 0;
}

Scoreboard .match-status { font-size: 15px; color: #c5cdd7; }
Scoreboard .match-round { font-size: 13px; color: #8996a6; }

Scoreboard .match-clock {
    padding-left: 24px;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    border-left: 1px solid rgba(197, 211, 224, 0.18);
}

Scoreboard .match-clock i { font-size: 21px; color: #8996a6; }
Scoreboard .match-clock label { font-size: 34px; font-weight: 600; min-width: 86px; }

Scoreboard .scoreboard-body {
    padding: 20px 24px;
    min-height: 0;
    flex-direction: column;
    flex-shrink: 1;
    gap: 16px;
    overflow: scroll;
}

Scoreboard .scoreboard-body > * { flex-shrink: 0; }

Scoreboard .rosters {
    width: 100%;
    align-items: stretch;
    gap: 18px;
}

Scoreboard .team-roster {
    width: 0;
    flex-basis: 0;
    flex-grow: 1;
    min-width: 0;
    min-height: 170px;
    flex-direction: column;
    border: 1px solid rgba(197, 211, 224, 0.1);
    border-top: 2px solid #75879a;
    background-color: rgba(6, 10, 15, 0.64);
    overflow: hidden;
}

Scoreboard .single-roster,
Scoreboard.compact .rosters {
    flex-direction: column;
}

Scoreboard .single-roster .team-roster,
Scoreboard.compact .team-roster {
    width: 100%;
    flex-basis: auto;
    flex-shrink: 0;
}

Scoreboard .team-heading {
    min-height: 96px;
    padding: 16px 20px;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
    border-bottom: 1px solid rgba(197, 211, 224, 0.08);
}

Scoreboard .team-logo { flex-shrink: 0; }

Scoreboard .team-identity {
    flex-direction: column;
    gap: 4px;
    min-width: 0;
    flex-grow: 1;
}

Scoreboard .team-name {
    font-size: 23px;
    font-weight: 700;
    white-space: nowrap;
    text-overflow: ellipsis;
    overflow: hidden;
}

Scoreboard .team-count { font-size: 13px; color: #97a5b6; font-weight: 500; }

Scoreboard .team-score {
    font-size: 52px;
    font-weight: 700;
    flex-shrink: 0;
    min-width: 65px;
    text-align: right;
    justify-content: flex-end;
    color: #f4f6f8;
}

Scoreboard .coop-icon { font-size: 42px; color: #b8c8d5; }
Scoreboard .coop-roster .team-heading { background-color: rgba(152, 177, 196, 0.06); }

Scoreboard .add-bot {
    padding: 7px 9px;
    gap: 5px;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: #a6b4c4;
    border: 1px solid rgba(197, 211, 224, 0.16);
    border-radius: 2px;
    background-color: rgba(7, 11, 16, 0.35);
    cursor: pointer;
}

Scoreboard .add-bot label { font-size: 12px; white-space: nowrap; }
